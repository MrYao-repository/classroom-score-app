name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿在此填写学生真实姓名、积分文件内容或任何个人信息。
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 24H2 / Windows 10 22H2
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本（用 exe 运行时可不填）
      placeholder: python --version 的输出
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开程序 2. 点击…… 3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错信息 / 截图
      render: shell
